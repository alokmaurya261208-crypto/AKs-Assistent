name: Build AKs Assistant APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Groq project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'AKs_Assistant_Groq_Free_Fixed_v2.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Groq project ZIP not found"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project

          PROJECT_DIR=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKs-Assistant-APK
          path: '$  {{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk'
