name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
       - name: Extract Android Project
        run: |
          unzip -o Aks_Assistant_Android_Project-1.zip -d project
          find project -name gradlew -print
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name gradlew -print -quit)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with
          name: AKs-Assistant-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
